name: main

on:
  push:
    branches:
      - "**"

permissions:
  contents: read # for checkout

# A new push cancels the previous run, except on release branches: it could stop a publish midway
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/develop", "refs/heads/release", "refs/heads/master", "refs/heads/main"]'), github.ref) }}

env:
  app: design

jobs:
  publish:
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    # Use github runner and not self-hosted as trusted publishing is only supported on github runners
    # https://docs.npmjs.com/trusted-publishers#limitations-and-future-improvements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm
      - name: Setup npm
        run: npm install npm@11.12 -g
      - run: npm ci
      - name: Release
        run: npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    runs-on: self-hosted-common
    needs: publish
    if: contains(fromJSON('["refs/heads/develop", "refs/heads/master", "refs/heads/main"]'), github.ref)
    steps:
      - uses: actions/checkout@v7
      - name: Login to BIMData Docker Registry
        uses: docker/login-action@v4
        with:
          registry: docker-registry.bimdata.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - id: tag
        name: Get docker tag
        uses: bimdata/actions/get-docker-tag@v6
        with:
          branch: ${{ github.ref }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/Dockerfile
          push: true
          pull: true
          tags: |
            docker-registry.bimdata.io/bimdata/${{ env.app }}:${{ github.sha }}
            docker-registry.bimdata.io/bimdata/${{ env.app }}:${{ env.tag }}
          # Runners are ephemeral: layer cache per environment in our registry, falling back on staging
          cache-from: |
            type=registry,ref=docker-registry.bimdata.io/bimdata/${{ env.app }}:buildcache-${{ env.tag }}
            type=registry,ref=docker-registry.bimdata.io/bimdata/${{ env.app }}:buildcache-staging
          cache-to: type=registry,ref=docker-registry.bimdata.io/bimdata/${{ env.app }}:buildcache-${{ env.tag }},mode=max,image-manifest=true

  deploy:
    runs-on: self-hosted-deploy
    needs: build-and-push
    steps:
      - name: Login to BIMData Docker Registry
        uses: docker/login-action@v4
        with:
          registry: docker-registry.bimdata.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - id: tag
        name: Get docker tag
        uses: bimdata/actions/get-docker-tag@v6
        with:
          branch: ${{ github.ref }}
      - name: Deploy on ${{ env.tag }}
        uses: bimdata/actions/deployment@v6
        with:
          inventory: ${{ env.tag }}
          app: ${{ env.app }}
          vault-pass: ${{ secrets.ANSIBLE_VAULT_PASSWD }}
